{% extends "base.html" %}
{% block title %}Edit {{ d.name }} - Admin{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin') }}">&larr; Back to Admin</a></p>

<section class="profile" style="max-width: 560px;">
  <h1>Edit Doctor</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Full Name *<input name="name" value="{{ d.name }}" required></label>
    <label>Degree<input name="degree" value="{{ d.degree }}" placeholder="e.g. MBBS, MD (Cardiology)"></label>
    <label>Speciality *<input name="speciality" value="{{ d.speciality }}" required></label>
    <label>Phone<input name="phone" value="{{ d.phone }}"></label>
    <label>WhatsApp Contact Number<input name="whatsapp" value="{{ d.whatsapp }}" placeholder="e.g. +91 98765 43210"></label>
    <label>Email<input name="email" type="email" value="{{ d.email }}"></label>
    <label>Bio<textarea name="bio" rows="3">{{ d.bio }}</textarea></label>
    <label class="check">
      <input type="checkbox" name="is_emergency" value="1" {{ 'checked' if d.is_emergency }}>
      Include in SOS Emergency / Ambulance Directory
    </label>
    <label class="check">
      <input type="checkbox" name="pharmacy_discount_eligible" value="1" {{ 'checked' if d.pharmacy_discount_eligible }}>
      Verified DoctorsOn enrolment — eligible for prescription offer checks
    </label>
    <label>Emergency Role / Note<input name="emergency_note" value="{{ d.emergency_note }}" placeholder="e.g. Cardiac ER &amp; Cath Lab"></label>
    <button class="btn primary" type="submit">Save changes</button>
  </form>
</section>
{% endblock %}
